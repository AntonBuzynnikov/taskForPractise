databaseChangeLog:
  - changeSet:
      id: init_customer_table
      author: anton (generated)
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_customer
                  name: id
                  type: BIGINT
              - column:
                  name: username
                  type: VARCHAR(255)
              - column:
                  name: password
                  type: VARCHAR(255)
              - column:
                  name: role
                  type: VARCHAR(255)
              - column:
                  constraints:
                    nullable: false
                  name: is_account_not_locking
                  type: BOOLEAN
              - column:
                  constraints:
                    nullable: false
                  name: failed_login_attempts
                  type: INT
            tableName: customer

